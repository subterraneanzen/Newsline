name: Feed probe
on: { push: { branches: [ feed-probe ] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - if: false
        run: PROBE_URLS=$PWD/tools/probe/urls.txt ./gradlew --no-daemon -q :core:test --tests '*LiveProbe*'; cat core/build/probe.txt
      - run: |
          curl -sL -A "Mozilla/5.0 (Linux; Android) PersonalNewsArchive/1.0" "https://news.cgtn.com/news/2026-11-09/Beijing-dismisses-Chinese-spy-claims-over-Nvidia-saga-as-smears-1RVNrUyd0VW/p.html" -o cgtn1.html
          curl -sL -A "Mozilla/5.0 (Linux; Android) PersonalNewsArchive/1.0" "https://news.cgtn.com/news/2026-11-10/VHJhbnNjcmlwdDkzMjMw/index.html" -o cgtn2.html
          curl -sL -A "Mozilla/5.0 (Linux; Android) PersonalNewsArchive/1.0" "https://panow.com/2026/11/10/hamiltons-pwhl-team-named-the-havoc-as-league-unveils-expansion-names-and-logos/" -o panow.html
      - run: |
          mkdir -p tools/probe/pages && mv *.html tools/probe/pages/
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add tools/probe/pages && git commit -qm pages && git push -q
